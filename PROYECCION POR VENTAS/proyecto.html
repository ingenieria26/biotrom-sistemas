<!DOCTYPE html><html lang="es"><head><script src="../assets/biotrom-auth.js"></script><meta charset="UTF-8"><title>Stock Master Pro - Dashboard</title><script src="../assets/xlsx-0.18.5.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>:root{--bg:#f8fafc;--panel:#ffffff;--accent:#3b82f6;--border:#e2e8f0;--proy:#059669;--pedir:#ea580c}*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}body{display:flex;height:100vh;background:var(--bg);overflow:hidden}.sidebar{width:280px;background:var(--panel);border-right:1px solid var(--border);padding:20px;display:flex;flex-direction:column;gap:15px}.drop-zone{border:2px dashed var(--border);padding:12px;text-align:center;border-radius:8px;cursor:pointer;font-size:11px;color:#64748b;font-weight:700;transition:.3s}.drop-zone.loaded{border-color:#10b981;background:#f0fdf4;color:#15803d;border-style:solid}.main{flex:1;padding:20px;overflow:hidden;display:flex;flex-direction:column;gap:15px}.tabs-header{display:flex;gap:5px;border-bottom:2px solid var(--border)}.tab-btn{padding:12px 20px;cursor:pointer;border:none;background:0 0;font-weight:700;color:#94a3b8;font-size:12px;text-transform:uppercase}.tab-btn.active{color:var(--accent);border-bottom:3px solid var(--accent)}.tab-content{display:none;flex:1;overflow:hidden;flex-direction:column}.tab-content.active{display:flex}.table-container{background:#fff;border-radius:12px;border:1px solid var(--border);flex:1;overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px;min-width:1100px}thead{position:sticky;top:0;background:#f8fafc;z-index:10;border-bottom:2px solid var(--border)}th{padding:10px;text-align:left;color:#475569;font-size:10px;font-weight:800}td{padding:8px 10px;border-bottom:1px solid #f1f5f9}.filter-select,.search-input{width:100%;padding:5px;border:1px solid var(--border);border-radius:4px;font-size:10px;margin-top:5px;outline:0;background:#fff}.clickable{color:var(--accent);cursor:pointer;font-weight:600;text-decoration:none}.badge{padding:4px 8px;border-radius:6px;font-weight:700;font-size:9px;text-align:center;display:inline-block;width:70px}.critico{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;overflow-y:auto;padding:10px}.chart-box{background:#fff;padding:15px;border-radius:12px;border:1px solid var(--border);min-height:300px}</style></head><body><aside class="sidebar"><h1 style="font-size:1.2rem;margin-bottom:10px;color:#1e293b">Stock<span style="color:var(--accent)">Master</span></h1><div id="drop-ventas" class="drop-zone" onclick='document.getElementById("file-ventas").click()'>1. CARGAR VENTAS<input type="file" id="file-ventas" hidden accept=".xlsx, .xls"></div><div id="drop-master" class="drop-zone" onclick='document.getElementById("file-master").click()'>2. CARGAR STOCK<input type="file" id="file-master" hidden accept=".xlsx, .xls"></div><div style="background:#f8fafc;padding:12px;border-radius:8px;border:1px solid var(--border)"><label style="font-size:10px;font-weight:800;color:#64748b">Meses a Proyectar</label> <input type="number" id="input-proy-meses" value="12" style="width:100%;padding:8px;margin-top:5px;border-radius:6px;border:1px solid #cbd5e1;font-weight:700" onchange="saveConfig();renderTable()"></div><button onclick="limpiarDatos()" style="margin-top:auto;padding:10px;background:#ef4444;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:10px;font-weight:700">LIMPIAR TODO</button></aside><main class="main"><div class="tabs-header"><button class="tab-btn active" onclick='switchTab("tab-stock",this)'>CONTROL DE STOCK</button> <button id="btn-tab-ventas" class="tab-btn" onclick='switchTab("tab-detalle-ventas",this)'>DETALLE DE VENTAS</button> <button class="tab-btn" onclick='switchTab("tab-graficos",this)'>GRÁFICOS</button></div><div id="tab-stock" class="tab-content active"><div class="table-container"><table id="mainTable"><thead><tr><th style="width:100px">CÓDIGO<br><input type="text" class="search-input" onkeyup="applyMainFilters()"></th><th>DESCRIPCIÓN<br><input type="text" class="search-input" onkeyup="applyMainFilters()"></th><th style="text-align:center">V. PROM</th><th style="text-align:center">STOCK</th><th style="text-align:center">COB.(M)</th><th style="text-align:center">Q. TENER</th><th style="text-align:center">A PEDIR</th><th style="width:130px">FABRICACIÓN</th><th style="width:90px">ESTADO</th></tr></thead><tbody id="tabla-body"></tbody></table></div></div><div id="tab-detalle-ventas" class="tab-content"><div style="padding:15px;background:#fff;border:1px solid var(--border);border-radius:8px;margin-bottom:10px"><h3 id="detalle-titulo" style="font-size:14px;color:#1e293b">Seleccione un producto en Stock</h3></div><div class="table-container"><table id="detalleTable"><thead><tr><th style="width:120px">Año / Fecha<br><select id="f-fecha" class="filter-select" onchange="applyDetalleFilters()"><option value="">Todos los años</option></select></th><th>Cliente</th><th style="text-align:center">Cantidad</th><th style="text-align:center">PtoV</th><th style="text-align:center">NroFactu</th><th style="width:150px">CodigoClien<br><select id="f-ccli" class="filter-select" onchange="applyDetalleFilters()"><option value="">Todos</option></select></th></tr></thead><tbody id="detalle-ventas-body"></tbody></table></div></div><div id="tab-graficos" class="tab-content"><div style="background:#fff;padding:15px;border-radius:8px;border:1px solid var(--border);margin-bottom:10px;display:flex;align-items:center;gap:15px"><span style="font-size:11px;font-weight:700;color:#64748b">ANÁLISIS DE PRODUCTO:</span> <select id="select-grafico-prod" class="filter-select" style="width:400px;margin:0" onchange="renderSpecificCharts(this.value)"></select></div><div class="chart-grid"><div class="chart-box" style="grid-column:span 2"><canvas id="chartTop10"></canvas></div><div class="chart-box"><canvas id="chartMensual"></canvas></div><div class="chart-box"><canvas id="chartAnual"></canvas></div></div></div></main><script>let store=[];let ventasHist={};let masterDataObj={};let mesesReales=1;let charts={top:null,mensual:null,anual:null};function _cargarDesdeLocalStorageYProcesar(){const savedVentas=localStorage.getItem("ventasHist");const savedMaster=localStorage.getItem("masterDataObj");const savedMeses=localStorage.getItem("mesesReales");const savedProy=localStorage.getItem("proyMeses");if(savedProy)document.getElementById("input-proy-meses").value=savedProy;if(savedVentas&&savedMaster){ventasHist=JSON.parse(savedVentas);Object.keys(ventasHist).forEach(cod=>{ventasHist[cod].forEach(v=>v.f=new Date(v.f))});masterDataObj=JSON.parse(savedMaster);mesesReales=parseFloat(savedMeses)||1;document.getElementById("drop-ventas").classList.add("loaded");document.getElementById("drop-master").classList.add("loaded");processData(false)}}window.onload=_cargarDesdeLocalStorageYProcesar;function saveConfig(){localStorage.setItem("proyMeses",document.getElementById("input-proy-meses").value)}function limpiarDatos(){if(confirm("¿Estás seguro de que quieres borrar todos los datos guardados?")){localStorage.clear();location.reload()}}function switchTab(id,btn){document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));document.getElementById(id).classList.add("active");btn.classList.add("active");if(id==="tab-graficos")setTimeout(renderGlobalCharts,100)}document.getElementById("file-ventas").onchange=e=>handleFile(e.target.files[0],"V");document.getElementById("file-master").onchange=e=>handleFile(e.target.files[0],"M");async function handleFile(file,tipo){const reader=new FileReader;reader.onload=e=>{const wb=XLSX.read(e.target.result,{cellDates:true,type:"array"});const data=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});if(tipo==="V"){ventasHist={};const tempMap=new Map;let fList=[];for(let i=1;i<data.length;i++){const r=data[i];const cod=String(r[0]||"").trim();const fecha=r[3];if(cod&&fecha instanceof Date){const key=`${fecha.getTime()}_${r[6]}_${r[7]}_${cod}`;const cant=Math.abs(parseFloat(r[2])||0);if(tempMap.has(key))tempMap.get(key).q+=cant;else tempMap.set(key,{f:fecha,q:cant,cli:r[1]||"---",ptov:r[5]||"-",fact:r[6]||"-",ccli:String(r[7]||"-"),cod:cod});fList.push(fecha)}}tempMap.forEach(v=>{if(!ventasHist[v.cod])ventasHist[v.cod]=[];ventasHist[v.cod].push(v)});const min=new Date(Math.min(...fList)),max=new Date(Math.max(...fList));mesesReales=Math.max(1,(max.getFullYear()-min.getFullYear())*12+(max.getMonth()-min.getMonth())+1);localStorage.setItem("ventasHist",JSON.stringify(ventasHist));localStorage.setItem("mesesReales",mesesReales);document.getElementById("drop-ventas").classList.add("loaded")}else{masterDataObj={};let startRow=0;for(let i=0;i<data.length;i++)if(String(data[i]).includes("Codigo")){startRow=i+1;break}for(let i=startRow;i<data.length;i++){const r=data[i];if(r[5])masterDataObj[String(r[5]).trim()]={d:r[6],s:parseFloat(r[8])||0}}localStorage.setItem("masterDataObj",JSON.stringify(masterDataObj));document.getElementById("drop-master").classList.add("loaded")}if(Object.keys(ventasHist).length&&Object.keys(masterDataObj).length)processData(true)};reader.readAsArrayBuffer(file)}function processData(shouldSave){store=Object.keys(ventasHist).map(cod=>{const m=masterDataObj[cod]||{d:"Sin descripción",s:0};return{cod:cod,...m,t:ventasHist[cod].reduce((acc,v)=>acc+v.q,0),fab:"Activo"}}).sort((a,b)=>a.cod.localeCompare(b.cod));document.getElementById("select-grafico-prod").innerHTML=store.map(i=>`<option value="${i.cod}">${i.cod} - ${i.d}</option>`).join("");renderTable()}function renderTable(){const proy=parseFloat(document.getElementById("input-proy-meses").value)||12;const body=document.getElementById("tabla-body");body.innerHTML=store.map(item=>{const prom=item.t/mesesReales;const cob=prom>0?item.s/prom:0;const quiero=Math.ceil(prom*proy),pedir=quiero-item.s;return`<tr>\n            <td><a class="clickable" onclick="verDetalle('${item.cod}')">${item.cod}</a></td>\n            <td>${item.d}</td>\n            <td style="text-align:center">${prom.toFixed(1)}</td>\n            <td style="text-align:center">${item.s}</td>\n            <td style="text-align:center">${cob.toFixed(1)}</td>\n            <td style="color:var(--proy);font-weight:bold;text-align:center">${quiero}</td>\n            <td style="color:var(--pedir);font-weight:bold;text-align:center">${pedir>0?pedir:"-"}</td>\n            <td><select class="filter-select" onchange="store.find(i=>i.cod==='${item.cod}').fab=this.value">\n                <option value="Activo">Activo</option><option value="Discontinuo">Discontinuo</option><option value="Preguntar">Preguntar</option>\n            </select></td>\n            <td><span class="badge ${cob<1?"critico":"ok"}">${cob<1?"CRÍTICO":"OK"}</span></td>\n        </tr>`}).join("")}function renderGlobalCharts(){const top10=[...store].sort((a,b)=>b.t-a.t).slice(0,10);if(charts.top)charts.top.destroy();charts.top=new Chart(document.getElementById("chartTop10"),{type:"bar",data:{labels:top10.map(i=>i.cod),datasets:[{label:"Ventas Totales",data:top10.map(i=>i.t),backgroundColor:"#3b82f6",borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{title:{display:true,text:"TOP 10 MÁS VENDIDOS"}}}});const initialCod=document.getElementById("select-grafico-prod").value;if(initialCod)renderSpecificCharts(initialCod)}function renderSpecificCharts(cod){const hist=ventasHist[cod]||[];const mData={},aData={};hist.forEach(v=>{const mKey=`${v.f.getFullYear()}-${String(v.f.getMonth()+1).padStart(2,"0")}`;const aKey=v.f.getFullYear();mData[mKey]=(mData[mKey]||0)+v.q;aData[aKey]=(aData[aKey]||0)+v.q});const labelsM=Object.keys(mData).sort();const labelsA=Object.keys(aData).sort();if(charts.mensual)charts.mensual.destroy();charts.mensual=new Chart(document.getElementById("chartMensual"),{type:"line",data:{labels:labelsM,datasets:[{label:"Mensual",data:labelsM.map(k=>mData[k]),borderColor:"#3b82f6",tension:.3,fill:true,backgroundColor:"rgba(59, 130, 246, 0.1)"}]},options:{responsive:true,maintainAspectRatio:false}});if(charts.anual)charts.anual.destroy();charts.anual=new Chart(document.getElementById("chartAnual"),{type:"bar",data:{labels:labelsA,datasets:[{label:"Anual",data:labelsA.map(k=>aData[k]),backgroundColor:"#10b981",borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false}})}function applyMainFilters(){const fCod=document.querySelectorAll("#mainTable .search-input")[0].value.toLowerCase();const fDes=document.querySelectorAll("#mainTable .search-input")[1].value.toLowerCase();const rows=document.getElementById("tabla-body").rows;for(let r of rows){const match=r.cells[0].innerText.toLowerCase().includes(fCod)&&r.cells[1].innerText.toLowerCase().includes(fDes);r.style.display=match?"":"none"}}function verDetalle(cod){const hist=ventasHist[cod]||[];const item=store.find(i=>i.cod===cod);document.getElementById("detalle-titulo").innerText=`HISTORIAL: ${cod} - ${item?.d||""}`;const años=[...new Set(hist.map(v=>v.f.getFullYear()))].sort((a,b)=>b-a);document.getElementById("f-fecha").innerHTML='<option value="">Todos los años</option>'+años.map(a=>`<option value="${a}">${a}</option>`).join("");const clientes=[...new Set(hist.map(v=>v.ccli))].sort();document.getElementById("f-ccli").innerHTML='<option value="">Todos</option>'+clientes.map(c=>`<option value="${c}">${c}</option>`).join("");document.getElementById("detalle-ventas-body").innerHTML=hist.sort((a,b)=>b.f-a.f).map(v=>`<tr data-year="${v.f.getFullYear()}">\n            <td>${v.f.toLocaleDateString()}</td><td>${v.cli}</td><td style="text-align:center; font-weight:bold">${v.q}</td>\n            <td style="text-align:center">${v.ptov}</td><td style="text-align:center">${v.fact}</td><td style="text-align:center">${v.ccli}</td>\n        </tr>`).join("");switchTab("tab-detalle-ventas",document.getElementById("btn-tab-ventas"))}function applyDetalleFilters(){const fYear=document.getElementById("f-fecha").value;const fCCli=document.getElementById("f-ccli").value;const rows=document.getElementById("detalle-ventas-body").rows;for(let r of rows){const mYear=fYear===""||r.getAttribute("data-year")===fYear;const mCCli=fCCli===""||r.cells[5].innerText===fCCli;r.style.display=mYear&&mCCli?"":"none"}}const FB_BASE_PROY="https://biotrom-carga-maquina-default-rtdb.firebaseio.com/proyeccion_ventas";const CLAVES_SYNC_PROY=["ventasHist","masterDataObj","mesesReales","proyMeses"];let _proyUltimoRemoto={};let _proyPendientes=new Set;async function _fbProyPush(key){const val=localStorage.getItem(key);if(val===null)return;let parsed;try{parsed=JSON.parse(val)}catch{parsed=val}_proyPendientes.add(key);try{const res=await BiotromAuth.fetch(`${FB_BASE_PROY}/${key}.json`,{method:"PUT",body:JSON.stringify(parsed),keepalive:true});if(res.ok){_proyUltimoRemoto[key]=JSON.stringify(parsed);_proyPendientes.delete(key)}}catch(e){}}async function _fbProyPull(){try{const res=await BiotromAuth.fetch(`${FB_BASE_PROY}.json`);if(!res.ok)return;const remoto=await res.json();if(!remoto)return;let huboCambios=false;CLAVES_SYNC_PROY.forEach(key=>{if(_proyPendientes.has(key)||!(key in remoto))return;const remotoStr=JSON.stringify(remoto[key]);if(remotoStr===_proyUltimoRemoto[key])return;_proyUltimoRemoto[key]=remotoStr;localStorage.setItem(key,typeof remoto[key]==="string"?remoto[key]:JSON.stringify(remoto[key]));huboCambios=true});if(huboCambios)_cargarDesdeLocalStorageYProcesar()}catch(e){}}(()=>{const origSetItem=localStorage.setItem.bind(localStorage);localStorage.setItem=function(k,v){origSetItem(k,v);if(CLAVES_SYNC_PROY.includes(k))_fbProyPush(k)}})();_fbProyPull();setInterval(_fbProyPull,8e3)</script></body></html>
