<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e3a8a">
<title>Costos BIOTROM</title>
<script src="../assets/biotrom-auth.js"></script>
<style>
:root{--bg:#f1f5f9;--card:#fff;--tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;--bd:#e2e8f0;--az:#1e3a8a;--az2:#3b82f6;--ok:#047857;--wa:#b45309;--er:#b91c1c;--chip:#e0e7ff}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--tx:#e2e8f0;--tx2:#94a3b8;--tx3:#64748b;--bd:#1f2b44;--az:#93c5fd;--az2:#60a5fa;--ok:#34d399;--wa:#fbbf24;--er:#f87171;--chip:#1e2a4a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:#1e3a8a;color:#fff;padding:10px 14px}
header h1{margin:0;font-size:17px;font-weight:700}
header small{display:block;opacity:.85;font-size:11.5px;margin-top:2px}
main{padding:12px 12px 80px;max-width:760px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 10px}
.kpi b{display:block;font-size:17px;color:var(--az)}.kpi span{font-size:10.5px;color:var(--tx2)}
.bar{display:flex;gap:8px;margin-bottom:8px}
input[type=search],select{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 11px;min-width:0}
input[type=search]{flex:1}select{max-width:46%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx2);border-radius:999px;padding:6px 11px;font-size:12.5px}
.chip.on{background:var(--az);color:#fff;border-color:var(--az)}
.row2{display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:12.5px;color:var(--tx2);flex-wrap:wrap}
.row2 label{display:flex;gap:5px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--tx2);padding:6px 11px;font:inherit}
.seg button.on{background:var(--az);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-weight:600;font-size:14px;word-break:break-word}
.cd{font:11.5px ui-monospace,Consolas,monospace;color:var(--tx3)}
.cost{text-align:right;flex:none}.cost b{font-size:17px;color:var(--az)}.cost small{display:block;font-size:10.5px;color:var(--tx3)}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;font-size:11.5px;color:var(--tx2)}
.tag{background:var(--chip);color:var(--az);border-radius:6px;padding:1px 7px}
.tag.w{background:#fef3c7;color:var(--wa)}.tag.e{background:#ede9fe;color:#6d28d9}
.det{display:none;margin-top:8px;border-top:1px dashed var(--bd);padding-top:8px;font-size:12.5px;color:var(--tx2)}
.card.open .det{display:block}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0 0 6px}.det dt{color:var(--tx3)}.det dd{margin:0;text-align:right;color:var(--tx)}
.comp{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid var(--bd)}
.comp i{font-style:normal;font-size:11px;color:var(--tx3)}
.sin{color:var(--er)}
.more{display:block;width:100%;border:1px solid var(--bd);background:var(--card);color:var(--az);border-radius:10px;padding:11px;font:inherit;font-weight:600}
.msg{text-align:center;color:var(--tx2);padding:26px 10px}
footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:9px 6px;font-size:13px}
footer a{color:var(--az);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<header><h1>Costos de fabricación</h1><small id="sub">Cargando…</small></header>
<main>
 <div class="kpis"><div class="kpi"><b id="k1">—</b><span>Costo anual</span></div><div class="kpi"><b id="k2">—</b><span>Piezas</span></div><div class="kpi"><b id="k3">—</b><span>Costo medio/pieza</span></div></div>
 <div class="bar"><input id="q" type="search" placeholder="Buscar código o nombre" autocomplete="off"><select id="ord"><option value="cod">Por código</option><option value="anual">Mayor costo anual</option><option value="tot">Mayor costo unitario</option></select></div>
 <div class="chips" id="fams"></div>
 <div class="row2"><span class="seg" id="mon"><button data-m="USD" class="on">USD</button><button data-m="ARS">ARS</button></span><label><input type="checkbox" id="solo" checked> solo con costo</label><span id="cnt"></span></div>
 <div id="lista"></div>
 <button class="more" id="mas" style="display:none">Ver más</button>
</main>
<footer><a href="calculadorapor%20(17).html?completa=1">Calculadora completa</a><a href="../BIOTROM_Inicio.html">Inicio</a></footer>
<script>
(function(){
"use strict";
var URL="https://iniciobt2-default-rtdb.firebaseio.com/costos_calculadora_por_producto/costos_resumen.json",LS="bt_costos_resumen_v1",D=null,fam="",mon="USD",N=40,lim=N;
function $(i){return document.getElementById(i)}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(t){t=String(t||"").toUpperCase();try{t=t.normalize("NFD").replace(/[̀-ͯ]/g,"")}catch(e){}return t}
function num(v,d){return v.toLocaleString("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d})}
function m(v){if(v==null)return null;return mon==="ARS"?v*(D.tc||1):v}
function money(v,d){v=m(v);return v==null?"—":(mon==="ARS"?"$ ":"US$ ")+num(v,d==null?2:d)}
function filas(){var q=norm($("q").value).trim(),solo=$("solo").checked,o=$("ord").value,out=D.rows.filter(function(r){if(solo&&r[7]==null)return false;if(fam&&r[2]!==fam)return false;if(q&&norm(r[0]+" "+r[1]).indexOf(q)<0)return false;return true});
 out.sort(function(a,b){if(o==="cod")return a[0]<b[0]?-1:1;var i=o==="tot"?7:8;return(b[i]==null?-1:b[i])-(a[i]==null?-1:a[i])});return out}
function card(r){var tipo=r[3],comps=r[12]||[],falta=r[11];
 var h='<div class="card" data-c="'+esc(r[0])+'"><div class="top"><div><div class="nm">'+esc(r[1])+'</div><div class="cd">'+esc(r[0])+'</div></div><div class="cost"><b>'+(r[7]==null?'<span class="sin">sin costo</span>':money(r[7],2))+'</b><small>por pieza</small></div></div>'
 +'<div class="meta"><span class="tag">'+esc(r[2])+'</span>'+(tipo!=="Fabricado"?'<span class="tag '+(tipo==="Ensamble"?'e':'w')+'">'+esc(tipo)+'</span>':'')+'<span>'+num(r[4],0)+' pz/año</span>'+(r[8]!=null?'<span>Anual '+money(r[8],0)+'</span>':'')+'</div>'
 +'<div class="det"><dl>'+(r[5]!=null?'<dt>Costo directo</dt><dd>'+money(r[5],2)+'</dd>':'')+(r[6]!=null?'<dt>Indirectos</dt><dd>'+money(r[6],2)+'</dd>':'')+(r[10]?'<dt>Materia prima</dt><dd>'+esc(r[10])+'</dd>':'')+'<dt>Origen</dt><dd>'+esc(r[9])+'</dd></dl>'
 +(falta?'<div class="sin">'+esc(falta)+'</div>':'')
 +(comps.length?'<b>Componentes</b>'+comps.map(function(c){return'<div class="comp"><span>'+esc(c[1])+' <i>'+esc(c[0])+(c[2]!==1?' × '+esc(c[2]):'')+'</i></span><span>'+(c[4]==null?'<span class="sin">sin costo</span>':money(c[4],2))+'</span></div>'}).join(""):'')
 +'</div></div>';return h}
function pintar(){if(!D)return;var f=filas(),h="";f.slice(0,lim).forEach(function(r){h+=card(r)});$("lista").innerHTML=h||'<div class="msg">No hay productos con ese filtro.</div>';$("cnt").textContent=f.length+" productos";$("mas").style.display=f.length>lim?"":"none";$("mas").textContent="Ver más ("+Math.min(N,f.length-lim)+" de "+(f.length-lim)+")"}
function kpis(){var con=D.rows.filter(function(r){return r[7]!=null}),an=con.reduce(function(a,r){return a+(r[8]||0)},0),pz=con.reduce(function(a,r){return a+r[4]},0);
 $("k1").textContent=money(an,0);$("k2").textContent=num(pz,0);$("k3").textContent=money(pz?an/pz:0,2)}
function cab(){var f={};D.rows.forEach(function(r){f[r[2]]=(f[r[2]]||0)+(r[8]||0)});var l=Object.keys(f).sort(function(a,b){return f[b]-f[a]});
 $("fams").innerHTML='<button class="chip'+(fam?"":" on")+'" data-f="">Todas</button>'+l.map(function(k){return'<button class="chip'+(fam===k?" on":"")+'" data-f="'+esc(k)+'">'+esc(k)+'</button>'}).join("");
 $("sub").textContent=(D.periodo||"")+" · calculado "+(D.fecha||"")+(D.tc?" · TC "+num(D.tc,0):"")}
function cargar(d){if(!d||!d.rows)return false;D=d;cab();kpis();pintar();return true}
$("q").addEventListener("input",function(){lim=N;pintar()});$("ord").addEventListener("change",function(){lim=N;pintar()});$("solo").addEventListener("change",function(){lim=N;pintar()});
$("fams").addEventListener("click",function(e){var b=e.target.closest(".chip");if(!b)return;fam=b.dataset.f;lim=N;cab();pintar()});
$("mon").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;mon=b.dataset.m;[].forEach.call($("mon").children,function(x){x.classList.toggle("on",x===b)});kpis();pintar()});
$("lista").addEventListener("click",function(e){var c=e.target.closest(".card");if(c)c.classList.toggle("open")});
$("mas").addEventListener("click",function(){lim+=N;pintar()});
try{var c=JSON.parse(localStorage.getItem(LS)||"null");if(c)cargar(c)}catch(e){}
var fx=(window.BiotromAuth&&BiotromAuth.fetch)?BiotromAuth.fetch.bind(BiotromAuth):fetch;
fx(URL).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){if(!d||!d.rows){if(!D)$("lista").innerHTML='<div class="msg">Todavía no hay costos publicados. Abrí la calculadora en la PC (pestaña Exportar) y se publican solos.</div>';return}
 if(D&&D.at===d.at)return;cargar(d);try{localStorage.setItem(LS,JSON.stringify(d))}catch(e){}}).catch(function(e){if(!D)$("lista").innerHTML='<div class="msg">No se pudo cargar ('+esc(e.message)+'). Probá de nuevo en unos minutos.</div>';$("sub").textContent=D?$("sub").textContent+" · sin conexión":"Sin conexión"});
})();
</script>
</body>
</html>
